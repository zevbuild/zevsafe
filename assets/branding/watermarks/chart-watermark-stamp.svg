<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <path id="textCircle" d="M 200, 200 m -160, 0 a 160,160 0 1,1 320,0 a 160,160 0 1,1 -320,0" />
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3987FF" />
      <stop offset="100%" stop-color="#24D5C5" />
    </linearGradient>
  </defs>

  <g opacity="0.32" transform="rotate(-15, 200, 200)">
    <!-- Outer Double Border Rings -->
    <circle cx="200" cy="200" r="190" fill="none" stroke="url(#stampGrad)" stroke-width="6" />
    <circle cx="200" cy="200" r="176" fill="none" stroke="url(#stampGrad)" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="200" cy="200" r="136" fill="none" stroke="url(#stampGrad)" stroke-width="3" />

    <!-- Circular Stamped Text -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="14.5"
          font-weight="800"
          letter-spacing="5.5"
          fill="url(#stampGrad)">
      <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
        ★ ZEVSAFE ZERO-KNOWLEDGE ★ AIR-GAPPED VERIFIED ★
      </textPath>
    </text>

    <!-- Center Biometric Iris Emblem -->
    <g transform="translate(200, 200)">
      <circle cx="0" cy="0" r="90" fill="none" stroke="url(#stampGrad)" stroke-width="2" stroke-dasharray="3,5" />
      <path d="M 0 -68 A 68 68 0 0 1 68 0 A 68 68 0 0 1 24 64"
            fill="none" stroke="url(#stampGrad)" stroke-width="14" stroke-linecap="round" />
      <path d="M 0 68 A 68 68 0 0 1 -68 0 A 68 68 0 0 1 -24 -64"
            fill="none" stroke="url(#stampGrad)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="url(#stampGrad)" stroke-width="6" />
      <circle cx="0" cy="0" r="16" fill="url(#stampGrad)" />
    </g>
  </g>
</svg>
