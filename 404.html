<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found · ZevSafe</title>
    
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables for theming */
        :root {
            --bg-base: #080c16; /* Deepest dark for background */
            --bg-slate: #0f172a;
            --teal: #00d2b4;
            --teal-glow: rgba(0, 210, 180, 0.3);
            --teal-hover: #00ebca;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.08);
            --bg-glass: rgba(15, 23, 42, 0.6);
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Background Decorative Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
        }
        body::before {
            width: 400px;
            height: 400px;
            background: rgba(0, 210, 180, 0.15);
            top: -100px;
            right: -100px;
        }
        body::after {
            width: 300px;
            height: 300px;
            background: rgba(15, 23, 42, 0.8);
            bottom: -50px;
            left: -50px;
        }

        /* Accessibility: Skip Link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--teal);
            color: #000;
            padding: 8px;
            z-index: 100;
            transition: top 0.2s ease;
            text-decoration: none;
            font-weight: 600;
        }
        .skip-link:focus {
            top: 0;
        }

        /* Main Content Container */
        main {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 2rem;
            display: flex;
            justify-content: center;
            outline: none; /* Remove focus outline on main when skipped to */
        }

        /* Glassmorphism Card */
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255,255,255,0.1);
            animation: fadeUp 0.6s ease-out forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animated Shield Icon */
        .icon-container {
            width: 96px;
            height: 96px;
            margin: 0 auto 1.5rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-container svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 12px var(--teal-glow));
        }

        .scanner-group {
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-5px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(25px); opacity: 0; }
        }

        /* Typography */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 1.75rem;
            background-color: var(--teal);
            color: var(--bg-base);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover {
            background-color: var(--teal-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px var(--teal-glow);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 4px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <main id="main-content" tabindex="-1">
        <div class="card">
            <!-- Custom Animated Shield SVG -->
            <div class="icon-container" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Define the shield shape for clipping the scanner -->
                        <clipPath id="shield-clip">
                            <path d="M12 2L3 6V11.5C3 16.5 6.84 21.74 12 23C17.16 21.74 21 16.5 21 11.5V6L12 2Z" />
                        </clipPath>
                        
                        <!-- Gradient for the scanner glow -->
                        <linearGradient id="scanner-grad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#00d2b4" stop-opacity="0" />
                            <stop offset="100%" stop-color="#00d2b4" stop-opacity="0.4" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Shield Background (Subtle fill) -->
                    <path d="M12 2L3 6V11.5C3 16.5 6.84 21.74 12 23C17.16 21.74 21 16.5 21 11.5V6L12 2Z" 
                          fill="rgba(0, 210, 180, 0.05)" />
                          
                    <!-- Scanner effect restricted to the shield shape -->
                    <g clip-path="url(#shield-clip)">
                        <g class="scanner-group">
                            <!-- Scanning Laser Line -->
                            <rect x="0" y="0" width="24" height="0.5" fill="#00d2b4" />
                            <!-- Scanning Glow Trailing -->
                            <rect x="0" y="-8" width="24" height="8" fill="url(#scanner-grad)" />
                        </g>
                    </g>

                    <!-- Shield Outline -->
                    <path d="M12 2L3 6V11.5C3 16.5 6.84 21.74 12 23C17.16 21.74 21 16.5 21 11.5V6L12 2Z" 
                          stroke="#00d2b4" 
                          stroke-width="1.5" 
                          stroke-linecap="round" 
                          stroke-linejoin="round" />
                          
                    <!-- Inner Security Checkmark -->
                    <path d="M9 12.5L11 14.5L15.5 9.5" 
                          stroke="#00d2b4" 
                          stroke-width="1.5" 
                          stroke-linecap="round" 
                          stroke-linejoin="round" />
                </svg>
            </div>
            
            <h1>404 — Access Denied</h1>
            <p>
                The requested resource does not exist, has been securely archived, or your current session lacks clearance to view it.
            </p>
            
            <a href="/" class="btn" aria-label="Return to the ZevSafe homepage">
                Return to ZevSafe
            </a>
        </div>
    </main>
</body>
</html>
