<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found · ZevSafe</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="u-flex-center" style="min-height: 100vh; flex-direction: column; text-align: center; padding: 2rem;">
    <div style="max-width: 460px; background: var(--bg-card, rgba(15,23,42,0.85)); border: 1px solid var(--border-color, rgba(255,255,255,0.1)); border-radius: 16px; padding: 2.5rem 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">🛡️</div>
        <h1 style="font-size: 1.8rem; margin: 0 0 0.5rem; color: #fff;">404 — Not Found</h1>
        <p style="color: var(--text-muted, #94a3b8); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem;">
            The requested page or document does not exist, has been archived, or is restricted in this deployment.
        </p>
        <a href="./" style="display: inline-block; padding: 0.7rem 1.5rem; background: var(--teal, #00d2b4); color: #000; font-weight: 700; border-radius: 8px; text-decoration: none; transition: opacity 0.2s;">
            Return to ZevSafe
        </a>
    </div>
</body>
</html>
